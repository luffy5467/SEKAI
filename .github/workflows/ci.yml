name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:protocol
      - run: pnpm build

  server:
    name: Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo clippy --manifest-path apps/server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/server/Cargo.toml

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [web, server]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ytroom
          POSTGRES_PASSWORD: ytroom
          POSTGRES_DB: ytroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ytroom -d ytroom" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && ./scripts/gen-keys.sh
      - run: pnpm --filter @sekai/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
